<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Strategy Tribunal: one question in, a defensible decision record out">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161A2E"/>
      <stop offset="1" stop-color="#1F2650"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="340" rx="24" fill="url(#bg)"/>
  <text x="60" y="96" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#FFFFFF">Strategy Tribunal</text>
  <text x="60" y="140" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#C7CDE6">One question in. A cross-examined, defensible decision record out.</text>
  <text x="60" y="170" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#8A93A6">Models in separate roles. A controller that commits only what passes the protocol. Runs inside Claude Code.</text>

  <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">
    <rect x="60" y="212" width="98" height="36" rx="18" fill="#2E8BFF"/><text x="109" y="236" text-anchor="middle" fill="#fff">framer</text>
    <rect x="168" y="212" width="134" height="36" rx="18" fill="#7C5CFF"/><text x="235" y="236" text-anchor="middle" fill="#fff">policy setter</text>
    <rect x="312" y="212" width="126" height="36" rx="18" fill="#0FA3A3"/><text x="375" y="236" text-anchor="middle" fill="#fff">strategists</text>
    <rect x="448" y="212" width="116" height="36" rx="18" fill="#F5A524"/><text x="506" y="236" text-anchor="middle" fill="#161A2E">reviewers</text>
    <rect x="574" y="212" width="98" height="36" rx="18" fill="#8AD425"/><text x="623" y="236" text-anchor="middle" fill="#161A2E">verifier</text>
    <rect x="682" y="212" width="88" height="36" rx="18" fill="#FFFFFF"/><text x="726" y="236" text-anchor="middle" fill="#161A2E">judge</text>
    <rect x="780" y="212" width="128" height="36" rx="18" fill="#FF5C6C"/><text x="844" y="236" text-anchor="middle" fill="#fff">challenger</text>
  </g>

  <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#C7CDE6">
    <text x="60" y="284">framed decision · gates and weighted criteria before any ranking · typed objections · matched rescoring</text>
    <text x="60" y="306">leader challenge · reversal conditions · one next action · follow-up prompt that carries it all back into the chat</text>
  </g>

  <g transform="translate(960,40)">
    <rect x="0" y="0" width="180" height="250" rx="16" fill="#FFFFFF" opacity="0.06" stroke="#C7CDE6" stroke-opacity="0.25"/>
    <text x="90" y="44" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#8A93A6">decision record</text>
    <rect x="20" y="62" width="140" height="10" rx="5" fill="#0FA3A3"/>
    <rect x="20" y="84" width="110" height="8" rx="4" fill="#C7CDE6" opacity="0.5"/>
    <rect x="20" y="100" width="128" height="8" rx="4" fill="#C7CDE6" opacity="0.5"/>
    <rect x="20" y="124" width="140" height="10" rx="5" fill="#F5A524"/>
    <rect x="20" y="146" width="96" height="8" rx="4" fill="#C7CDE6" opacity="0.5"/>
    <rect x="20" y="162" width="120" height="8" rx="4" fill="#C7CDE6" opacity="0.5"/>
    <rect x="20" y="186" width="140" height="10" rx="5" fill="#FF5C6C"/>
    <rect x="20" y="208" width="104" height="8" rx="4" fill="#C7CDE6" opacity="0.5"/>
    <rect x="20" y="224" width="132" height="8" rx="4" fill="#C7CDE6" opacity="0.5"/>
  </g>
</svg>
