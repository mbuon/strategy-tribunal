[project]
name = "strategy-tribunal"
version = "0.1.0"
description = "Strategy Tribunal: autonomous 360-degree decision engine for strategy questions (deterministic controller, validated protocol, adversarial review, global judge, chat step-mode, opt-in OpenCode adapter)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
council = "llm_council.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_council"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
